<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Surya M — AI Engineer. Building intelligent systems with LLMs, RAG, and agentic AI.">
  <title>Surya M — AI Engineer</title>
  <desc>Open Graph image for Surya M's portfolio — AI Engineer specialising in LLMs, RAG, and agentic systems.</desc>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0e1116"/>
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#2d3545" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <!-- Gradient fade at bottom -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1116" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0e1116" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <!-- Accent dot -->
  <circle cx="96" cy="96" r="6" fill="#8ab4ff"/>
  <!-- Monogram badge -->
  <rect x="80" y="70" width="52" height="52" rx="8" fill="#0b57d0"/>
  <text x="106" y="104" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">SM</text>
  <!-- Name -->
  <text x="80" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="80" font-weight="700" fill="#e8ecf2" letter-spacing="-2">Surya M</text>
  <!-- Role -->
  <text x="80" y="320" font-family="ui-monospace, monospace" font-size="24" fill="#8ab4ff" letter-spacing="2">AI ENGINEER</text>
  <!-- Value prop -->
  <text x="80" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a3adbb">Building intelligent systems with LLMs, RAG</text>
  <text x="80" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a3adbb">and agentic AI · 5 hackathon wins</text>
  <!-- Proof facts -->
  <rect x="80" y="490" width="1040" height="1" fill="#2d3545"/>
  <text x="80"  y="530" font-family="ui-monospace, monospace" font-size="18" fill="#8ab4ff">5 wins</text>
  <text x="80"  y="555" font-family="ui-monospace, monospace" font-size="14" fill="#6b7585">hackathons</text>
  <text x="260" y="530" font-family="ui-monospace, monospace" font-size="18" fill="#8ab4ff">₹60K prize</text>
  <text x="260" y="555" font-family="ui-monospace, monospace" font-size="14" fill="#6b7585">CMR Hackfest 3.0</text>
  <text x="480" y="530" font-family="ui-monospace, monospace" font-size="18" fill="#8ab4ff">8.43 CGPA</text>
  <text x="480" y="555" font-family="ui-monospace, monospace" font-size="14" fill="#6b7585">AI & DS, KCET Trichy</text>
  <text x="700" y="530" font-family="ui-monospace, monospace" font-size="18" fill="#8ab4ff">JHU finalist</text>
  <text x="700" y="555" font-family="ui-monospace, monospace" font-size="14" fill="#6b7585">Health Hackathon 2025</text>
</svg>
